name: Tests de codigo

on:
  pull_request:
    paths: ["**.py", "requirements*.txt", ".github/workflows/tests.yml"]
  push:
    branches: [main, "codex/**"]
    paths: ["**.py", "requirements*.txt", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -q
        env:
          PYTHON_DOTENV_DISABLED: "1"
