name: Price watch

# Actions cobra cada job redondeado al minuto completo, asi que 3 workflows
# separados costaban 3 minutos por ciclo aunque el escaneo real de los tres
# perfiles toma ~18s. Consolidados: 1 minuto por ciclo.
#
# Las tiendas no mueven precios de madrugada, asi que no escaneamos entre las
# 00:00 y las 08:00 CLT y gastamos todo el presupuesto en el horario util:
# 15 horas seguidas cada 15 min = 60 jobs/dia (~1.800 min/mes), dentro del
# plan Free con margen.
#
# Por que 15 min y no 10: GitHub atrasa los schedules entre 5 y 20 min bajo
# carga. Con intervalo nominal de 10 min la deriva es mayor que el intervalo
# y el espaciado real igual queda irregular, asi que la granularidad extra es
# ficticia. Las horas de cobertura, en cambio, son reales -- al mismo costo
# preferimos 15h cada 15 min antes que 10h cada 10 min.
#
# Los cron son UTC y Chile cambia de huso en septiembre (UTC-4 -> UTC-3).
# La ventana 12:00-02:59 UTC cae en 08:00-22:59 CLT en invierno y en
# 09:00-23:59 CLT en verano: cubre el dia comercial completo en ambos casos
# sin tener que editar esto dos veces al ano.
#
# Los minutos van desfasados (2,17,32,47) a proposito: GitHub documenta que
# la hora en punto es el peor momento para agendar.
# Disparador principal: un Worker de Cloudflare (cloudflare-cron/) llama a
# repository_dispatch cada 10 min. El cron de GitHub de abajo se mantiene como
# red de seguridad: si el Worker deja de disparar, el bot sigue corriendo -- mal
# espaciado, pero corriendo. Medido antes de esto, el schedule de GitHub solo
# cumplia el 23% de las corridas previstas (14/dia de 60).
on:
  repository_dispatch:
    types: [escanear]
  schedule:
    - cron: "2,17,32,47 12-23 * * *"
    - cron: "2,17,32,47 0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-watch-run
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Mide la puntualidad del disparador: el Worker manda la hora que el cron
      # pretendia y la que se ejecuto de verdad. Sin esto no hay forma de saber
      # si cambiar de disparador sirvio de algo.
      # Los valores del client_payload van por `env`, NUNCA interpolados con
      # ${{ }} dentro del `run`. Actions sustituye esas expresiones en el texto
      # del script antes de ejecutarlo, asi que un desfase_s valiendo
      #   "; curl algo | sh; #
      # se ejecutaria como comando, con contents:write y todos los secrets a
      # mano. Por `env` el runner los pasa como variables y el shell nunca los
      # interpreta como codigo. printf %s en vez de echo para que un valor que
      # empiece con - no se coma como opcion.
      - name: Puntualidad del disparo
        if: github.event_name == 'repository_dispatch'
        env:
          PROGRAMADO: ${{ github.event.client_payload.programado_iso }}
          REAL: ${{ github.event.client_payload.real_iso }}
          DESFASE: ${{ github.event.client_payload.desfase_s }}
        run: |
          {
            printf '| disparo | valor |\n'
            printf '|---|---|\n'
            printf '| programado | %s |\n' "$PROGRAMADO"
            printf '| real | %s |\n' "$REAL"
            printf '| desfase | %ss |\n' "$DESFASE"
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Desfase del disparador: %ss\n' "$DESFASE"

      - uses: actions/checkout@v4

      # Estado de la capa rapida (cabeceras condicionales, huellas, contador de
      # disparo). NO va en git: cambia en cada disparo y dejaria un diff por
      # corrida. El runner es efimero, asi que se conserva aca.
      #
      # La clave lleva el run_id porque una entrada de cache en Actions es
      # inmutable: con clave fija el primer guardado gana y nunca se actualiza.
      # `restore-keys` recupera la mas reciente que empiece con el prefijo.
      #
      # Perderlo no rompe nada: sin cabeceras previas el ciclo siguiente pide sin
      # condicional (200 en vez de 304) y sin huellas marca todo como cambiado
      # una vez. Se degrada, no falla.
      - name: Estado de la capa rapida
        uses: actions/cache@v4
        with:
          path: .estado-rapido-*.json
          key: estado-rapido-${{ github.run_id }}
          restore-keys: estado-rapido-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Bloqueante a proposito: si la logica de deteccion esta rota preferimos
      # perder unos escaneos antes que mandar alertas basura o ensuciar el
      # historial. Son ~1s y GitHub avisa por mail si falla.
      - name: Tests
        run: python -m unittest -v

      # continue-on-error para que la caida de un perfil no se lleve a los
      # otros ni impida guardar el historial de los que si corrieron.
      - name: Perfumes
        id: perfumes
        continue-on-error: true
        run: python run.py
        env:
          PROFILE: perfumes
          DB_PATH: price_watch_perfumes.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Hardware
        id: hardware
        continue-on-error: true
        run: python run.py
        env:
          PROFILE: hardware
          DB_PATH: price_watch_hardware.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.HARDWARE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Celulares
        id: celulares
        continue-on-error: true
        run: python run.py
        env:
          PROFILE: celulares
          DB_PATH: price_watch_celulares.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.CELULARES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # --- Capas lenta + rapida -------------------------------------------
      #
      # Complementan a run.py, no lo reemplazan. run.py sigue barriendo el
      # catalogo completo por /products/browse/; esto vigila una watchlist
      # acotada consultando la tienda directo, que es lo unico capaz de ver una
      # caida que dura menos que el remuestreo de Solotodo (~4h de mediana).
      #
      # Comparten la tabla `alerts`, o sea que comparten presupuesto diario y
      # cooldown. Es lo que se quiere: un mismo producto no debe alertar dos
      # veces por venir de dos caminos distintos.
      #
      # La capa lenta se dispara sola cuando la watchlist pasa de 12h; el resto
      # de los ciclos solo corre la rapida (~0,3s cuando las tiendas responden
      # 304, medido).
      - name: Capas perfumes
        id: capas_perfumes
        continue-on-error: true
        run: python run_capas.py
        env:
          PROFILE: perfumes
          DB_PATH: price_watch_perfumes.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Capas hardware
        id: capas_hardware
        continue-on-error: true
        run: python run_capas.py
        env:
          PROFILE: hardware
          DB_PATH: price_watch_hardware.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.HARDWARE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Capas celulares
        id: capas_celulares
        continue-on-error: true
        run: python run_capas.py
        env:
          PROFILE: celulares
          DB_PATH: price_watch_celulares.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.CELULARES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar historial de precios
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          # Si un perfil fallo antes de crear su .db, no queremos que el
          # `git add` se lleve el paso completo y perdamos el resto.
          for f in price_watch_perfumes.db price_watch_hardware.db price_watch_celulares.db; do
            [ -f "$f" ] && git add "$f"
          done
          # Sin cambios de precio los .db quedan identicos byte a byte, asi
          # que la mayoria de los ciclos no generan commit.
          git diff --cached --quiet && echo "Sin cambios de precio" && exit 0
          git commit -m "Actualiza historial de precios"

          # NO usar `pull --rebase`: git no sabe fusionar los .db porque son
          # binarios. Reproducido en laboratorio: el rebase conflictua, queda a
          # medias, y los reintentos NO pueden funcionar -- cada uno vuelve a
          # fallar por el rebase pendiente. La corrida perdia sus observaciones.
          #
          # El .db es estado DERIVADO, asi que ante un rechazo se descarta el
          # commit propio, se toma el .db del remoto y se reaplican encima las
          # observaciones que quedaron en el sidecar. Sin repetir una sola
          # peticion a la API.
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push rechazado (intento $i): el remoto avanzo, reaplicando"
            git fetch origin main || exit 1
            git reset --hard FETCH_HEAD
            for p in perfumes hardware celulares; do
              [ -f ".observaciones-$p.json" ] || continue
              DB_PATH="price_watch_$p.db" python reaplicar.py ".observaciones-$p.json"
            done
            for f in price_watch_perfumes.db price_watch_hardware.db price_watch_celulares.db; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then
              echo "Tras reaplicar no queda nada nuevo: el remoto ya lo tenia"
              exit 0
            fi
            git commit -m "Actualiza historial de precios"
            sleep $((RANDOM % 10 + 3))
          done
          echo "No se pudo pushear el historial tras 5 intentos" >&2
          exit 1

      # Guardar los perfiles sanos primero y hacer visible cualquier fallo despues.
      - name: Comprobar resultado de los perfiles
        if: always()
        env:
          RESULTADOS: >-
            ${{ steps.perfumes.outcome }} ${{ steps.hardware.outcome }}
            ${{ steps.celulares.outcome }} ${{ steps.capas_perfumes.outcome }}
            ${{ steps.capas_hardware.outcome }} ${{ steps.capas_celulares.outcome }}
        run: |
          for resultado in $RESULTADOS; do
            if [ "$resultado" = failure ]; then
              echo "Al menos un perfil fallo. Consultar el resumen y los logs." >&2
              exit 1
            fi
          done
